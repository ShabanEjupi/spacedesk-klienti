# 🔔 SpaceDesk — ndërtimi i iOS-it, i nxjerrë nga `flutter-build.yml`.
#
# 🚨 MOS E SHKRUAJ ME DORË. Prodhohet nga `klienti/nxirr-ios.py` te depoja
# `spacedesk` (Gitea). Ndreq skriptin dhe nise sërish ([[vegla-nje-burim-i-vetem]]).
name: SpaceDesk iOS

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform stays on FLUTTER_VERSION (3.24.5) until Windows 7
  # support is restored after the upstream-wide Flutter bump. The arm64 job patches the few
  # 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.4.9"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"
  BUNDLE_ID: "tech.spacecode.desk"
  APPLE_TEAM_ID: "WUU9UVHFKF"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-rustdesk-ios:
    timeout-minutes: 150
    name: build rustdesk ios ipa
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-apple-ios,
              os: macos-latest,
              vcpkg-triplet: arm64-ios,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          brew install nasm yasm
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Ngul marken SpaceDesk
        env:
          SPACEDESK_RRENJA: ${{ github.workspace }}
        run: |
          python3 spacecode/marka.py
          grep -q 'RwLock::new("SpaceDesk".to_owned())' libs/hbb_common/src/config.rs \
            || { echo "⛔ APP_NAME nuk u ngul"; exit 1; }
          grep -q 'RENDEZVOUS_SERVERS: &\[&str\] = &\["desk.spacecode.tech"\]' libs/hbb_common/src/config.rs \
            || { echo "⛔ serveri nuk u ngul — app-i do te fliste me rs-ny.rustdesk.com"; exit 1; }

      - name: Bundle ID, ekipi dhe entitlements (iOS)
        run: |
          set -e
          P=flutter/ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/com\.carriez\.flutterHbb/$BUNDLE_ID/g; s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/g" "$P"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$P" || { echo "⛔ bundle ID s'u ngul"; exit 1; }
          ! grep -q carriez "$P" || { echo "⛔ mbeti com.carriez te projekti"; exit 1; }
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" flutter/ios/Runner/Runner.entitlements || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.networking.wifi-info" flutter/ios/Runner/Runner.entitlements || true
          cat flutter/ios/Runner/Runner.entitlements
          # Apple 2.3.8: emri te pajisja duhet të gjendet te emri i dyqanit
          # («SpaceDesk: Remote Access»).
          EMRI=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" flutter/ios/Runner/Info.plist)
          echo "emri te pajisja: $EMRI"
          [ "$EMRI" = "SpaceDesk" ] || { echo "⛔ 2.3.8: emri te pajisja është «$EMRI»"; exit 1; }
          # Ikona: logoja e RustDesk-ut ishte unazë blu mbi sfond të BARDHË.
          sips -g pixelWidth -g hasAlpha flutter/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png \
            | tee /dev/stderr | grep -q "hasAlpha: no" || { echo "⛔ ikona 1024 ka alfa (ITMS-90717)"; exit 1; }

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: ${{ matrix.job.target }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk lib
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib
          
      - name: Upload liblibrustdesk.a Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liblibrustdesk.a
          path: target/aarch64-apple-ios/release/liblibrustdesk.a

      # 🔔 SpaceDesk: i njëjti nënshkrim si `linux-install/tools/ios/ios-appstore.yml`
      #    — shiko komentet atje për çdo kurth (-lut, pkcs12, partition-list, hex).
      - name: Certifikata dhe profili te keychain-i
        env:
          P12_B64:  ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASS: ${{ secrets.IOS_DIST_P12_PASS }}
          PROF_HEX: ${{ secrets.IOS_PROFILE_HEX }}
        run: |
          set -e
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" ndertimi.keychain
          security default-keychain -s ndertimi.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" ndertimi.keychain
          security set-keychain-settings -lut 7200 ndertimi.keychain
          echo "$P12_B64" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -f pkcs12 -k ndertimi.keychain -P "$P12_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/dist.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" ndertimi.keychain >/dev/null
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf %s "$PROF_HEX" | perl -0777 -ne 's/\s+//g; print pack("H*", $_)' > /tmp/p.mobileprovision
          # UUID-ja lexohet nga vetë profili; një profil i cunguar s'kalon `cms -D`.
          security cms -D -i /tmp/p.mobileprovision > /tmp/p.plist \
            || { echo "⛔ profili nuk është CMS i vlefshëm"; exit 1; }
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/p.plist)
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/p.plist)
          echo "profili $UUID · $APPID"
          [ "$APPID" = "$APPLE_TEAM_ID.$BUNDLE_ID" ] || { echo "⛔ profili i përket $APPID"; exit 1; }
          mv /tmp/p.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          security find-identity -v -p codesigning ndertimi.keychain

      - name: Profilet te projekti Xcode
        run: |
          set -e
          python3 -m pip install --quiet --break-system-packages codemagic-cli-tools \
            || python3 -m pip install --quiet codemagic-cli-tools
          export PATH="$PATH:$HOME/.local/bin:$(python3 -m site --user-base)/bin"
          xcode-project use-profiles --project flutter/ios/Runner.xcodeproj
          cat "$HOME/export_options.plist"

      - name: Build rustdesk
        shell: bash
        run: |
          set -e
          # Numri i ndërtimit: minuta nga 01-01-2026 — i njëjti formulë si
          # `ios-ndertim.sh`, që ASC të mos e shohë kurrë dy herë.
          BN=$(( ( $(date +%s) - 1767225600 ) / 60 ))
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          pushd flutter
          flutter build ipa --release --build-number="$BN" \
            --export-options-plist="$HOME/export_options.plist"
          ls -la build/ios/ipa/

      - name: Ngarkimi te TestFlight
        env:
          ASC_KEY_B64:   ${{ secrets.ASC_KEY_B64 }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          mkdir -p ~/private_keys
          echo "$ASC_KEY_B64" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          ipa=$(ls flutter/build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "✅ ndërtimi $BUILD_NUMBER u ngarkua"

      - name: Upload IPA (SpaceDesk)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacedesk-ipa
          path: flutter/build/ios/ipa/*.ipa
          if-no-files-found: warn

      # - name: Upload Artifacts
      #   # if: env.ANDROID_SIGNING_KEY != null && env.UPLOAD_ARTIFACT == 'true'
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   with:
      #     name: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
      #     path: flutter/build/ios/ipa/*.ipa

      # - name: Publish ipa package
      #   # if: env.ANDROID_SIGNING_KEY != null && env.UPLOAD_ARTIFACT == 'true'
      #   uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
